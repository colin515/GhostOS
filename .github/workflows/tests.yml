name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offscreen Qt libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install pytest PyQt6 webrtcvad-wheels httpx fastapi pillow psutil pydantic pyyaml numpy opencv-python-headless ruff
      - run: python -m compileall -q agent automation ui config.py main.py setup.py build_tools
      - run: python -m ruff check .
      - run: python -m pytest -q
