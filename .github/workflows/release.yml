name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ollama>=0.6.3,<1' 'pydantic>=2.9,<3' pillow numpy opencv-python-headless psutil tabulate
      - name: Install verified Ollama runtime
        run: |
          curl --fail --location --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.10/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "1e8ad2d2a394efdd235bee74deec237badd95142ffba77588140ab2a9ecec227  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama-runtime"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama-runtime"
          rm "$RUNNER_TEMP/ollama.tar.zst"
          echo "$RUNNER_TEMP/ollama-runtime/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .ollama-models
          key: ollama-cpu-qwen35-08b-protocol-v1
      - name: Start loopback-only local server and download test weights
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:0.8b
      - name: Verify real local tool calls and structured vision output
        run: python build_tools/check_local_model.py
      - name: Print local server diagnostics on failure
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/ollama.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: local-model-verification
          path: dist/local-model-verification.json
          if-no-files-found: error
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match VERSION' }
          } elseif ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must run from main or a matching version tag'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Verify maintained voice distribution metadata
        run: python -c "from importlib.metadata import version; print('webrtcvad-wheels', version('webrtcvad-wheels'))"
      - name: Verify bundled Windows-Use SDK imports and native UIA
        run: python -c "from agent.windows_use_engine import local_desktop; from ghostos_vendor.windows_use.uia import GetRootControl; desktop = local_desktop(); assert GetRootControl(); print('Windows-Use native UIA ready')"
      - name: Freeze application
        run: python build_tools/build.py
      - name: Check frozen imports, native input, media playback, tabs, model setup and neural speech
        run: |
          dist\GhostOS\GhostOS.exe --version
          dist\GhostOS\GhostOS.exe --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Frozen import check failed' }
          dist\GhostOS\GhostOS.exe --input-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen native mouse check failed' }
          dist\GhostOS\GhostOS.exe --browser-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen browser control check failed' }
          dist\GhostOS\GhostOS.exe --voice-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen neural speech check failed' }
          dist\GhostOS\GhostOS.exe --indicator-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen indicator check failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: ./build_tools/ensure_inno.ps1
      - name: Compile installer
        shell: pwsh
        run: |
          & $env:GHOSTOS_ISCC "/DAppVersion=$env:APP_VERSION" build_tools/GhostOS_installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Install and uninstall smoke test
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'GhostOSSmoke'
          $setup = Get-Item "dist/GhostOS_Installer_v$env:APP_VERSION.exe"
          $p = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          & "$target/GhostOS.exe" --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          & "$target/GhostOS.exe" --desktop-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop did not open' }
          $p = Start-Process "$target/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Upgrade an existing hidden installation and repair startup
        shell: pwsh
        run: ./build_tools/test_upgrade.ps1
      - name: Print startup diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'GhostOS/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 120 }
      - name: Package versioned documentation and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path docs,README.md,LICENSE,VERSION -DestinationPath "dist/GhostOS_docs_v$env:APP_VERSION.zip"
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip','.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/GhostOS_Installer_*.exe
            dist/GhostOS_docs_*.zip
            dist/SHA256SUMS.txt
            dist/build-dependencies.txt
          if-no-files-found: error
  publish:
    needs: [build, local-model]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: local-model-verification
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          model_hash=$(sha256sum release/local-model-verification.json | cut -d ' ' -f 1)
          echo "$model_hash  local-model-verification.json" >> release/SHA256SUMS.txt
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$TARGET_SHA" ]; then
            echo "Superseded by a newer main commit; publish the newer build instead."
            exit 1
          fi
          gh release create "$TAG" release/* --target "$TARGET_SHA" --title "GhostOS $TAG" --generate-notes --notes "Install GhostOS by downloading and running GhostOS_Installer_$TAG.exe. Python is bundled; install Ollama separately when prompted on first launch. Versioned documentation is attached as a ZIP and available at https://github.com/$GH_REPO/tree/$TAG/docs . Installer is unsigned; see installation.md."
