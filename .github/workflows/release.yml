name: Windows release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match VERSION' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Freeze application
        run: python build_tools/build.py
      - name: Check frozen CLI
        run: |
          dist\GhostOS\GhostOS.exe --version
          dist\GhostOS\GhostOS.exe --diagnostics
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" build_tools/GhostOS_installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Install and uninstall smoke test
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'GhostOSSmoke'
          $setup = Get-Item "dist/GhostOS_Installer_v$env:APP_VERSION.exe"
          $p = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          & "$target/GhostOS.exe" --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          $p = Start-Process "$target/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Package versioned documentation and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path docs,README.md,LICENSE,VERSION -DestinationPath "dist/GhostOS_docs_v$env:APP_VERSION.zip"
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip','.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/GhostOS_Installer_*.exe
            dist/GhostOS_docs_*.zip
            dist/SHA256SUMS.txt
            dist/build-dependencies.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --verify-tag --title "GhostOS $TAG" --generate-notes --notes "Versioned documentation is attached as a ZIP and available at https://github.com/$GH_REPO/tree/$TAG/docs . Installer is unsigned; see installation.md."
