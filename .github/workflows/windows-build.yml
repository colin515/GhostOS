name: Windows package validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python build_tools/build.py
      - name: Frozen executable smoke test
        shell: pwsh
        run: |
          & dist/GhostOS/GhostOS.exe --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Frozen resource/import check failed' }
      - name: Install Inno Setup
        run: choco install innosetup --version=6.4.3 --yes --no-progress
      - name: Compile and test installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" build_tools/GhostOS_installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $target = Join-Path $env:RUNNER_TEMP 'GhostOSSmoke'
          $installer = (Get-Item "dist/GhostOS_Installer_v$version.exe").FullName
          $p = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          & "$target/GhostOS.exe" --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Installed application check failed' }
          $p = Start-Process "$target/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: GhostOS-windows-preview
          path: |
            dist/GhostOS_Installer_*.exe
            dist/build-dependencies.txt
          if-no-files-found: error
